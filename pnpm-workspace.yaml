allowBuilds:
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - react-dom@19.3.1
  - react@19.3.1
  - electron@44.8.0
nodeLinker: hoisted
overrides:
  # Cheerio's decodeBuffer/DecodeStream API is preserved in encoding-sniffer 1.x.
  # This release replaces unsupported whatwg-encoding with @exodus/bytes.
  'cheerio>encoding-sniffer': ^1.0.2
